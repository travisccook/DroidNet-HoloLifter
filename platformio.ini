; PlatformIO Project Configuration File
;
; HoloLifter - Astromech Droid Holographic Platform Lifter
; SparkFun ESP32 Thing Plus (Micro-B USB)
;
; Build options: build flags, source filter
; Upload options: custom upload port, speed and extra flags
; Library options: dependencies, extra library storages
; Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
; Plain "pio run" / "pio run -t upload" must only ever touch the real firmware,
; never the rollback-test image or the native test env.
default_envs = esp32thing_plus

[env:esp32thing_plus]
; pioarduino = Arduino-ESP32 3.3.12 on ESP-IDF 5.5.5 (ESP-NOW v2, 252-byte WCB
; packets). Pinned to a release, never the moving "stable" link.
; https://github.com/pioarduino/platform-espressif32/releases/tag/55.03.312-1
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = esp32thing_plus
framework = arduino

; Serial Monitor settings
monitor_speed = 115200
monitor_filters = direct

; Upload settings (ESP32 supports much faster uploads)
upload_speed = 921600

; Build flags
build_flags =
    -DESP32_THING_PLUS
    -I include

; Library dependencies
lib_deps =
    sparkfun/Serial Controlled Motor Driver@^1.0.3
    madhephaestus/ESP32Encoder@5.0.0

; Extra scripting (if needed for custom build steps)
; extra_scripts = pre:scripts/build_version.py

; Bench-only: an image that never starts the mesh, used once to prove that an
; OTA update which cannot reach the mesh rolls back on its own.
; Never flash it by cable; only upload it through maintenance-mode OTA.
[env:esp32thing_plus_rollbacktest]
extends = env:esp32thing_plus
build_flags =
    ${env:esp32thing_plus.build_flags}
    -DHOLOMESH_ROLLBACK_TEST

; -----------------------------------------------------------------------------
; Native host environment for off-hardware unit tests (lib/WcbCore,
; lib/NodeConfig, lib/MaintCore, lib/LiftCommands, lib/MotionProfile). Runs
; pure C++ logic under Unity.
; Usage: pio test -e native   (or -f <suite> to run one suite)
; -----------------------------------------------------------------------------
[env:native]
platform = native
test_framework = unity
; i2c_scanner is an on-hardware utility (needs Arduino.h) — never build it natively.
test_ignore = i2c_scanner
build_flags =
    -std=c++17
    -I include
